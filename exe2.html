<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax</title>
    <script>
        window.onload = inicio;

        function inicio() {
            let botao = document.getElementById('botao');
            botao.addEventListener('click', envia);
        }

        function envia() {
            let saida = document.getElementById('resultado');
            let numero = document.getElementById('numero');
            numero = numero.value;
            const xhttp = new XMLHttpRequest(); // objeto responsável pelo envio e recebimento.

            // função chamada quando carregar os dados (resposta)
            xhttp.onload = function () {
                // o que fazer com os dados
                console.log(this.responseText);
                saida.innerHTML += this.responseText;
            }

            // ajuste e envio dos dados
            xhttp.open("GET", `http://localhost/pagina_n.php?numero=${numero}`);
            xhttp.send();
        }
    </script>
</head>

<body>
    <label for="">Digite um número:</label>
    <input type="text" name="numero" id="numero"><br>
    <button id="botao">Enviar</button>
    <p id="resultado"></p>
</body>

</html>
